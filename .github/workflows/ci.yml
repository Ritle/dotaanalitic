name: CI
on:
  push:
  pull_request:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm npm lockfile is committed
        run: test -s pnpm-lock.yaml || { echo 'Generate real pnpm-lock.yaml with node scripts/bootstrap-lockfile.mjs'; exit 1; }
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-migrations.mjs
      - run: node scripts/check-doc-links.mjs
      - run: node --test tests/node/*.test.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dota
          POSTGRES_PASSWORD: ci_password_only
          POSTGRES_DB: dota_analytics_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dota -d dota_analytics_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://dota:ci_password_only@localhost:5432/dota_analytics_test
    steps:
      - uses: actions/checkout@v4
      - name: Confirm npm lockfile is committed
        run: test -s pnpm-lock.yaml || { echo 'Generate real pnpm-lock.yaml with node scripts/bootstrap-lockfile.mjs'; exit 1; }
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate production Compose with isolated synthetic settings
        shell: bash
        run: |
          unset DATABASE_URL POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD SITE_HOST WEB_ORIGIN AUTH_COOKIE_SECRET PANDASCORE_API_TOKEN OPENDOTA_API_KEY OPENDOTA_RPM_BUDGET OPENDOTA_DAILY_BUDGET OPENDOTA_MONTHLY_BUDGET
          task_envfile=$(mktemp)
          trap 'rm -f -- "$task_envfile"' EXIT
          cat > "$task_envfile" <<'SYNTHETIC_ENV'
          # Synthetic configuration only; no app, provider request or deployment is started.
          NODE_ENV=production
          SITE_HOST=analytics.personal-domain.net
          WEB_ORIGIN=https://analytics.personal-domain.net
          POSTGRES_DB=dota
          POSTGRES_USER=owner
          POSTGRES_PASSWORD=synthetic-production-password
          DATABASE_URL=postgresql://owner:synthetic-production-password@postgres:5432/dota
          AUTH_COOKIE_SECRET=synthetic-cookie-key-at-least-thirty-two-characters
          PANDASCORE_API_TOKEN=synthetic-provider-token
          SYNTHETIC_ENV
          node scripts/preflight.mjs --production --strict --env-file "$task_envfile" --json
      - run: node scripts/migrate.mjs
      - run: node scripts/migrate.mjs # must be idempotent
      - run: pnpm test:integration
      - run: pnpm test:ingestion
      - run: pnpm test:auth
      - run: pnpm test:temporal
      - run: pnpm test:identity
      - run: pnpm test:identity-provision
      - run: pnpm test:game-context
      - run: pnpm test:dataset
      - run: pnpm test:readiness
      - run: pnpm test:catalog
      - run: pnpm test:pro-maps
      - run: pnpm test:roster
      - run: pnpm test:player-hero
      - run: pnpm test:strength
      - run: pnpm test:sample
      - run: pnpm test:patch-history
      - run: pnpm test:compare
      - run: pnpm test:upcoming
      - run: pnpm test:history-refresh

  ml-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/ml/requirements-ci.txt
      - run: python -m pip install --no-deps -e tools/ml
      - run: python -m pytest tools/ml/tests -q
      - run: python tools/ml/train.py --dataset tests/fixtures/ml/synthetic_history.jsonl --output /tmp/dota-demo-candidate.json --allow-synthetic
      - run: python tools/ml/evaluate.py /tmp/dota-demo-candidate.json
      - run: node scripts/check-ml-parity.mjs /tmp/dota-demo-candidate.json

  e2e-bootstrap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dota
          POSTGRES_PASSWORD: ci_password_only
          POSTGRES_DB: dota_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dota -d dota_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://dota:ci_password_only@localhost:5432/dota_e2e
    steps:
      - uses: actions/checkout@v4
      - name: Confirm npm lockfile is committed
        run: test -s pnpm-lock.yaml || { echo 'Generate real pnpm-lock.yaml with node scripts/bootstrap-lockfile.mjs'; exit 1; }
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dota/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
